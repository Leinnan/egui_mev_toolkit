[package]
name = "egui_mev_graphics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
exclude.workspace = true
description = "Drawing-tool controls for egui: response-curve editor, colour editor with hue triangle, and canvas rulers"

[lib]
doctest = false

[dependencies]
egui.workspace = true
egui_mev_core = { path = "../egui_mev_core" }
egui_mev_theme = { path = "../egui_mev_theme" }

[dev-dependencies]
egui = { workspace = true, features = ["default_fonts"] }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }

[lints]
workspace = true
