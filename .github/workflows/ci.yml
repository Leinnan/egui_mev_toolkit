name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - run: cargo metadata --locked --format-version 1 > /dev/null
      - run: just check
      - run: just check-alone
      - run: just check-web
      # Baselines come from macOS, and Linux's software renderer rasterizes
      # differently: run every snapshot test, but re-record instead of comparing.
      - run: cargo nextest run --workspace --all-features --profile ci
        env:
          UPDATE_SNAPSHOTS: "true"

  # The native menu only compiles on macOS, so the Linux job never sees it.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo nextest run --workspace --all-features --profile ci

  # Registry accent, DWM chrome, Segoe fonts and the DX12 path only run here.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Baselines come from macOS, as on Linux.
      - run: cargo nextest run --workspace --all-features --profile ci
        env:
          UPDATE_SNAPSHOTS: "true"
